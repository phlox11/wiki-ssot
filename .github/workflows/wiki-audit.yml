name: weekly wiki audit

on:
  schedule:
    # Monday 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiki-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: HUSKY=0 bun install --frozen-lockfile
      - name: Run full audit
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun run wiki:audit -- --json | tee wiki-audit.json
      - name: Write summary
        if: always()
        shell: bash
        run: |
          echo "## Weekly wiki audit" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat wiki-audit.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiki-audit
          path: wiki-audit.json
      - name: Preserve audit result
        if: steps.audit.outcome == 'failure'
        run: exit 1
